<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f5f0eb;
      color: #3a3a3a;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.4rem;
      color: #2c2c2c;
    }

    .count {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: #4a7c6f;
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
      position: sticky;
      top: 0;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
    }

    tr:nth-child(even) { background: #faf8f5; }
    tr:hover { background: #f0ece7; }

    td.browser {
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .badge-variant {
      background: #ede7f6;
      color: #5e35b1;
    }

    .badge-main {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .badge-proof {
      background: #e6f4ea;
      color: #137333;
    }

    .badge-human {
      background: #e6f4ea;
      color: #137333;
    }

    .badge-bot {
      background: #fce8e6;
      color: #c5221f;
    }

    .badge-unclear {
      background: #fef7e0;
      color: #b06000;
    }

    td a {
      color: #4a7c6f;
      text-decoration: none;
      font-weight: 600;
    }

    td a:hover { text-decoration: underline; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .pagination {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 20px 24px;
      margin-top: 20px;
      padding: 16px 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      font-size: 0.85rem;
    }

    .pagination.visible { display: flex; }

    .pagination .page-size-group,
    .pagination .nav-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .pagination label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .pagination .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pagination .pagination-sub {
      color: #666;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .pagination button {
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      min-width: 2.5rem;
      padding: 8px 12px;
      border: 1px solid #4a7c6f;
      border-radius: 8px;
      background: #4a7c6f;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination button:not(:disabled):hover {
      background: #3d6a5f;
    }

    .pagination select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e5ddd5;
      background: #faf8f5;
    }

    .pagination input[type="number"]#pageInput {
      font-family: inherit;
      font-size: 0.85rem;
      width: 3.5rem;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #e5ddd5;
      background: #faf8f5;
      text-align: center;
      -moz-appearance: textfield;
    }

    .pagination input[type="number"]#pageInput::-webkit-outer-spin-button,
    .pagination input[type="number"]#pageInput::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .pagination .goto-page-wrap {
      display: inline-flex;
      align-items: center;
    }

  </style>
</head>
<body>
  <h1>Visitor Log</h1>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <div class="loading" id="loading">Loading...</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Date &amp; Time</th>
          <th>Variant</th>
          <th>Viewed</th>
          <th>IP Address</th>
          <th>City</th>
          <th>Region</th>
          <th>Country</th>
          <th>Location</th>
          <th>Browser</th>
          <th>Visitor</th>
          <th>Org</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination" aria-label="Pagination">
    <div class="page-size-group">
      <label>
        Filter
        <select id="pageFilter">
          <option value="all">All Visits</option>
          <option value="main">Biodata Only</option>
          <option value="proofs">Income Proofs Only</option>
        </select>
      </label>
      <label>
        Variant
        <select id="variantFilter">
          <option value="all">All Variants</option>
        </select>
      </label>
      <label>
        Rows per page
        <select id="pageSize">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </label>
      <span class="pagination-sub" id="showingRange"></span>
    </div>
    <div class="nav-group">
      <span class="pagination-sub" id="pageRange"></span>
      <div class="goto-page-wrap">
        <input type="number" id="pageInput" min="1" step="1" inputmode="numeric" aria-label="Go to page number" title="Press Enter or leave this field to go to that page">
      </div>
      <div class="nav-buttons">
        <button type="button" id="btnFirst" aria-label="First page">&#171;</button>
        <button type="button" id="btnPrev" aria-label="Previous page">&#8249;</button>
        <button type="button" id="btnNext" aria-label="Next page">&#8250;</button>
        <button type="button" id="btnLast" aria-label="Last page">&#187;</button>
      </div>
    </div>
  </div>

  <script>
    const PROJECT = 'finances-388507';
    const COLLECTION = 'biodata-visits';

    const CLOUD_ORGS = [
      'amazon', 'aws', 'google', 'microsoft', 'azure', 'digitalocean',
      'ovh', 'hetzner', 'linode', 'oracle', 'alibaba', 'tencent',
      'contabo', 'vultr', 'scaleway', 'ibm cloud'
    ];

    function parseBrowser(ua) {
      const mobile = /Mobile|Android/i.test(ua) ? ' Mobile' : '';
      let name, ver;

      if ((ver = ua.match(/WhatsApp\/(\d+)/i))) return `WhatsApp/${ver[1]}`;
      else if ((ver = ua.match(/MiuiBrowser\/(\d+)/i))) name = 'MiuiBrowser';
      else if ((ver = ua.match(/Edg(?:A|iOS)?\/(\d+)/))) name = 'Edge';
      else if ((ver = ua.match(/OPR\/(\d+)/))) name = 'Opera';
      else if ((ver = ua.match(/Chrome\/(\d+)/))) name = 'Chrome';
      else if ((ver = ua.match(/Firefox\/(\d+)/))) name = 'Firefox';
      else if ((ver = ua.match(/Version\/(\d+).*Safari/))) name = 'Safari';
      else return ua.substring(0, 50);

      return `${name}${mobile}/${ver[1]}`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function getField(doc, name) {
      const f = doc.fields?.[name];
      return f?.stringValue || f?.doubleValue?.toString() || '–';
    }

    function getVariant(doc) {
      const f = doc.fields?.variant;
      const v = f?.stringValue;
      if (v && v.trim() !== '') return v.trim().toUpperCase();
      return 'A'; // Legacy visits prior to variant tracking default to Variant A
    }

    function formatVariantBadge(doc) {
      const v = getVariant(doc);
      return `<span class="badge badge-variant">Variant ${v}</span>`;
    }

    function populateVariantFilter() {
      const select = document.getElementById('variantFilter');
      if (!select) return;
      const currentVal = select.value || 'all';
      const variants = new Set();
      allDocs.forEach(doc => variants.add(getVariant(doc)));

      const sorted = Array.from(variants).sort();
      select.innerHTML = '<option value="all">All Variants</option>';
      sorted.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = `Variant ${v}`;
        select.appendChild(opt);
      });
      if (Array.from(select.options).some(o => o.value === currentVal)) {
        select.value = currentVal;
      }
    }

    function getProofLabel(doc) {
      const p = getField(doc, 'page');
      const act = getField(doc, 'action');

      let label = null;
      if (p && p.startsWith('Proof:')) {
        label = p.replace(/^Proof:\s*/i, '').trim();
      } else if (act && act !== 'Page' && act !== 'NONE' && act !== 'None' && act !== '–') {
        label = act;
      } else if (p && (p.toLowerCase().includes('proof') || p.endsWith('.pdf'))) {
        if (p.includes('JUN_2026') || p.toLowerCase().includes('payslip')) label = 'Payslip';
        else if (p.includes('ACK') || p.toLowerCase().includes('itr')) label = 'ITR Ack';
        else label = 'Income Proof';
      }

      if (label === 'Jun 2026 Payslip') return 'Payslip';
      return label;
    }

    function isProofDoc(doc) {
      return getProofLabel(doc) !== null;
    }

    function formatPageBadge(doc) {
      const label = getProofLabel(doc);
      if (label) {
        return `<span class="badge badge-proof">${label}</span>`;
      }
      return '<span class="badge badge-main">Biodata</span>';
    }

    function getFilteredDocs() {
      const filterVal = document.getElementById('pageFilter')?.value || 'all';
      const variantVal = document.getElementById('variantFilter')?.value || 'all';

      return allDocs.filter(doc => {
        if (filterVal === 'main' && isProofDoc(doc)) return false;
        if (filterVal === 'proofs' && !isProofDoc(doc)) return false;
        if (variantVal !== 'all' && getVariant(doc) !== variantVal) return false;
        return true;
      });
    }

    function updateCounts() {
      const total = allDocs.length;
      const proofCount = allDocs.filter(isProofDoc).length;
      const mainCount = total - proofCount;

      const variantCounts = {};
      allDocs.forEach(doc => {
        const v = getVariant(doc);
        variantCounts[v] = (variantCounts[v] || 0) + 1;
      });

      const variantSummary = Object.keys(variantCounts)
        .sort()
        .map(v => `Variant ${v}: ${variantCounts[v]}`)
        .join(' · ');

      let text = `${total} visit${total !== 1 ? 's' : ''}`;
      if (variantSummary) {
        text += ` (${variantSummary})`;
      }
      if (proofCount > 0) {
        text += ` — ${mainCount} Biodata · ${proofCount} Income Proof${proofCount !== 1 ? 's' : ''}`;
      }
      document.getElementById('count').textContent = text;
    }

    let rapidDuplicateIps = new Set();

    function computeRapidDuplicateIps(docs, windowMs = 10000) {
      const byIp = new Map();
      docs.forEach(doc => {
        const ip = getField(doc, 'ip');
        if (!ip || ip === 'unknown' || ip === '–') return;
        const ts = new Date(getField(doc, 'timestamp')).getTime();
        if (Number.isNaN(ts)) return;
        if (!byIp.has(ip)) byIp.set(ip, []);
        byIp.get(ip).push(ts);
      });

      const flagged = new Set();
      byIp.forEach((timestamps, ip) => {
        timestamps.sort((a, b) => a - b);
        for (let i = 1; i < timestamps.length; i++) {
          if (timestamps[i] - timestamps[i - 1] <= windowMs) {
            flagged.add(ip);
            break;
          }
        }
      });
      return flagged;
    }

    let repeatedCloudUas = new Set();

    function computeRepeatedCloudUas(docs) {
      const uaToIps = new Map();
      docs.forEach(doc => {
        const org = getField(doc, 'org').toLowerCase();
        const ua = getField(doc, 'browser');
        const ip = getField(doc, 'ip');
        if (!ua || ua === '–') return;
        if (!CLOUD_ORGS.some(k => org.includes(k))) return;
        if (!uaToIps.has(ua)) uaToIps.set(ua, new Set());
        uaToIps.get(ua).add(ip);
      });

      const repeated = new Set();
      uaToIps.forEach((ips, ua) => {
        if (ips.size > 1) repeated.add(ua);
      });
      return repeated;
    }

    function classifyVisitor(doc) {
      const ua = getField(doc, 'browser').toLowerCase();
      const org = getField(doc, 'org').toLowerCase();
      const ip = getField(doc, 'ip');

      const botUaHints = [
        'bot', 'crawl', 'spider', 'slurp', 'facebookexternalhit', 'whatsapp',
        'telegrambot', 'slackbot', 'discordbot', 'curl', 'wget',
        'python-requests', 'headless', 'lighthouse', 'pingdom', 'uptimerobot', 'preview'
      ];
      // Desktop Chrome/Chromium (incl. Edge, Opera) silently auto-updates within days, so a build
      // this many majors behind is almost certainly a stale hardcoded scraper UA. Mobile OEM
      // browsers (MIUI, ColorOS/HeyTap, Vivo, Samsung...) bundle their own slow-updating Chromium
      // WebView, so a years-old Chrome major there is normal and must NOT be flagged.
      // Bump this floor upward every so often as real desktop Chrome versions climb.
      const MIN_PLAUSIBLE_CHROME_MAJOR = 120;
      const mobileOrOemHints = [
        'android', 'iphone', 'ipad', 'mobile',
        'miuibrowser', 'heytapbrowser', 'vivobrowser', 'samsungbrowser',
        'ucbrowser', 'opera mini', 'coloros'
      ];

      if (botUaHints.some(k => ua.includes(k))) return 'bot';
      const chromeMatch = ua.match(/chrome\/(\d+)/);
      const looksLikePlainDesktop = !mobileOrOemHints.some(k => ua.includes(k));
      if (looksLikePlainDesktop && chromeMatch && Number(chromeMatch[1]) < MIN_PLAUSIBLE_CHROME_MAJOR) return 'bot';

      // Same-IP signals below only mean anything on a single-tenant cloud/hosting IP.
      // Mobile carrier IPs (Airtel, Jio, ...) are heavily CGNAT'd, so many unrelated
      // real subscribers can share one public IP at the same moment.
      if (CLOUD_ORGS.some(k => org.includes(k))) {
        if (rapidDuplicateIps.has(ip)) return 'bot';
        if (repeatedCloudUas.has(getField(doc, 'browser'))) return 'bot';
        return 'unclear';
      }
      return 'human';
    }

    function formatVisitorBadge(doc) {
      const verdict = classifyVisitor(doc);
      if (verdict === 'bot') return '<span class="badge badge-bot">Bot</span>';
      if (verdict === 'unclear') return '<span class="badge badge-unclear">Unclear</span>';
      return '<span class="badge badge-human">Human</span>';
    }

    function mapsLink(doc) {
      const lat = doc.fields?.latitude?.doubleValue;
      const lng = doc.fields?.longitude?.doubleValue;
      if (lat && lng) {
        return `<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">📍 View</a>`;
      }
      return '–';
    }

    let allDocs = [];
    let currentPage = 1;
    let pageSize = 25;

    function totalPages() {
      const docs = getFilteredDocs();
      return Math.max(1, Math.ceil(docs.length / pageSize));
    }

    function renderTablePage() {
      const tbody = document.getElementById('tbody');
      const docs = getFilteredDocs();
      const total = docs.length;
      const pages = totalPages();
      if (currentPage > pages) currentPage = pages;

      const start = (currentPage - 1) * pageSize;
      const slice = docs.slice(start, start + pageSize);

      tbody.innerHTML = '';
      slice.forEach((doc, i) => {
        const rowNum = start + i + 1;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${rowNum}</td>
            <td>${formatDate(getField(doc, 'timestamp'))}</td>
            <td>${formatVariantBadge(doc)}</td>
            <td>${formatPageBadge(doc)}</td>
            <td>${getField(doc, 'ip')}</td>
            <td>${getField(doc, 'city')}</td>
            <td>${getField(doc, 'region')}</td>
            <td>${getField(doc, 'country')}</td>
            <td>${mapsLink(doc)}</td>
            <td class="browser" title="${getField(doc, 'browser')}">${parseBrowser(getField(doc, 'browser'))}</td>
            <td>${formatVisitorBadge(doc)}</td>
            <td>${getField(doc, 'org')}</td>`;
        tbody.appendChild(tr);
      });

      const end = Math.min(start + slice.length, total);
      const showingEl = document.getElementById('showingRange');
      const pageEl = document.getElementById('pageRange');
      if (total === 0) {
        showingEl.textContent = 'No rows';
        pageEl.textContent = '';
      } else {
        showingEl.textContent = `Showing ${start + 1}–${end} of ${total}`;
        pageEl.textContent = `Page ${currentPage} of ${pages}`;
      }

      const atFirst = currentPage <= 1;
      const atLast = currentPage >= pages;
      document.getElementById('btnFirst').disabled = atFirst;
      document.getElementById('btnPrev').disabled = atFirst;
      document.getElementById('btnNext').disabled = atLast;
      document.getElementById('btnLast').disabled = atLast;

      const pageInput = document.getElementById('pageInput');
      if (total === 0) {
        pageInput.value = '';
        pageInput.disabled = true;
        pageInput.removeAttribute('max');
      } else {
        pageInput.disabled = false;
        pageInput.max = String(pages);
        pageInput.min = '1';
        pageInput.value = String(currentPage);
      }
    }

    function goToPageFromInput() {
      const docs = getFilteredDocs();
      const total = docs.length;
      if (total === 0) return;
      const pages = totalPages();
      let n = parseInt(document.getElementById('pageInput').value, 10);
      if (Number.isNaN(n)) return;
      n = Math.min(Math.max(1, n), pages);
      currentPage = n;
      renderTablePage();
    }

    document.getElementById('pageFilter').addEventListener('change', () => {
      currentPage = 1;
      renderTablePage();
    });

    document.getElementById('variantFilter').addEventListener('change', () => {
      currentPage = 1;
      renderTablePage();
    });

    document.getElementById('pageSize').addEventListener('change', (e) => {
      pageSize = Number(e.target.value);
      currentPage = 1;
      renderTablePage();
    });

    document.getElementById('btnFirst').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage = 1;
        renderTablePage();
      }
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderTablePage();
      }
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentPage < totalPages()) {
        currentPage++;
        renderTablePage();
      }
    });

    document.getElementById('pageInput').addEventListener('change', goToPageFromInput);

    document.getElementById('pageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        goToPageFromInput();
      }
    });

    document.getElementById('btnLast').addEventListener('click', () => {
      const pages = totalPages();
      if (currentPage < pages) {
        currentPage = pages;
        renderTablePage();
      }
    });

    fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/${COLLECTION}?pageSize=1000`)
      .then(res => res.json())
      .then(data => {
        allDocs = data.documents || [];

        allDocs.sort((a, b) => {
          const ta = getField(a, 'timestamp');
          const tb = getField(b, 'timestamp');
          return tb.localeCompare(ta);
        });

        rapidDuplicateIps = computeRapidDuplicateIps(allDocs);
        repeatedCloudUas = computeRepeatedCloudUas(allDocs);

        populateVariantFilter();
        updateCounts();
        document.getElementById('loading').style.display = 'none';

        document.getElementById('table').style.display = 'table';
        document.getElementById('pagination').classList.add('visible');

        pageSize = Number(document.getElementById('pageSize').value);
        currentPage = 1;
        renderTablePage();
      })
      .catch(err => {
        document.getElementById('loading').textContent = 'Failed to load visitor data.';
        console.error(err);
      });
  </script>
</body>
</html>
